name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    runs-on: macos-14     # Apple silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build engine test, then run it
        run: |
          cmake --build build --target engine_test sweep_test -j4
          ./build/engine_test
          JUNK=0xFF ./build/sweep_test 48000
          JUNK=0x7F ./build/sweep_test 44100

      - name: Build AU + VST3
        run: cmake --build build --target Elements_AU Elements_VST3 -j4

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/Elements_artefacts/Release/AU/*.component build/Elements_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Elements_artefacts/Release/AU/*.component dist/
          cp -R build/Elements_artefacts/Release/VST3/*.vst3 dist/
          lipo -archs dist/*.component/Contents/MacOS/*
          # Show the minimum macOS version baked into each slice (should say 11.0):
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; done
          cat > dist/INSTALL.txt <<'TXT'
          1. Unzip.
          2. Open Terminal and run:   xattr -dr com.apple.quarantine ~/Downloads/Elements-macOS/*
             (adjust the path if you unzipped elsewhere; this clears the "downloaded from internet" block)
          3. Copy "Unofficial Elements.component" to  ~/Library/Audio/Plug-Ins/Components/
             Copy "Unofficial Elements.vst3"       to  ~/Library/Audio/Plug-Ins/VST3/
          4. In Logic: Settings > Plug-in Manager > rescan.
          5. To PLAY it from a MIDI keyboard: make a Software Instrument track, click its Instrument slot, and choose
             Audio Units > AU MIDI-controlled Effects > particledots: Unofficial Elements.
             (It is not in the Audio FX slot's MIDI path. In the Audio FX slot it works only as a plain effect, with no MIDI notes.)
          6. To excite it with another track's audio instead: in the plug-in, choose how the audio input is routed
             (Audio Input menu) and choose that track in the plug-in's Side Chain menu (top right of its window).
             Audio sent to STRIKE rings the resonator with no gate. Audio sent to BLOW is shaped by the Contour envelope,
             so it needs a gate (MIDI note, or the GATE button).
          TXT
          ditto -c -k --keepParent dist Elements-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Elements-macOS
          path: Elements-macOS.zip
